<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Paramètres — DomPilot</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<script src="app.js"></script>
<script>
const content = dpRenderShell("parametres", "Paramètres", "Connexion GitHub, utilisateurs et référentiels");
if (content) render();

function render() {
  const cfg = dpGetGithubConfig() || {};
  content.innerHTML = `
    <div class="grid-2">
      <div class="card">
        <div class="card-title">Dépôt privé de données</div>
        <div class="text-muted mb-14">
          DomPilot fonctionne avec <b>deux dépôts GitHub</b> : celui qui héberge cette application
          (public, servi par GitHub Pages) et un second, <b>privé</b>, qui contient uniquement le
          fichier <code>data.json</code> avec les données réelles. Renseignez ci-dessous les
          coordonnées du dépôt <b>privé</b> uniquement.
        </div>
        <div class="login-error" style="display:block;background:#fbeadb;color:var(--orange);">
          ⚠ Le token est stocké dans le navigateur (localStorage) pour permettre les appels à l'API
          GitHub depuis l'app. Utilisez un <b>fine-grained token</b> limité à ce seul dépôt privé,
          avec uniquement les droits "Contents: Read and write", et évitez de partager cet écran ou
          les outils de développement du navigateur.
        </div>
        <div class="field"><label>Propriétaire du dépôt privé (owner)</label>
          <input id="g-owner" value="${cfg.owner || ''}" placeholder="ex. domo-bdx"></div>
        <div class="field"><label>Nom du dépôt privé</label>
          <input id="g-repo" value="${cfg.repo || ''}" placeholder="ex. dompilot-immobilier-data"></div>
        <div class="field"><label>Chemin du fichier de données</label>
          <input id="g-path" value="${cfg.path || 'data.json'}"></div>
        <div class="field"><label>Personal Access Token (fine-grained, ce dépôt uniquement)</label>
          <input id="g-token" type="password" value="${cfg.token || ''}" placeholder="github_pat_…"></div>
        <div class="flex gap-8">
          <button class="btn btn-primary" onclick="saveGithubCfg()">Enregistrer la connexion</button>
          <button class="btn btn-outline" onclick="dpSyncWithGitHub()">Écrire maintenant</button>
          <button class="btn btn-outline" onclick="loadNow()">Recharger depuis GitHub</button>
        </div>
      </div>

      <div class="card">
        <div class="flex-between mb-14">
          <div class="card-title mt-0" style="margin:0;">Utilisateurs</div>
          <button class="btn btn-sm btn-outline" onclick="addUser()">+ Ajouter</button>
        </div>
        <table>
          <thead><tr><th>Nom</th><th>Identifiant</th><th>Rôle</th><th>Mot de passe</th><th></th></tr></thead>
          <tbody>
            ${DP.utilisateurs.map(u => `
              <tr>
                <td>${u.nom}</td>
                <td>${u.identifiant}</td>
                <td>${u.role}</td>
                <td>${u.passwordHash
                  ? `<span class="badge badge-vert">Défini</span>`
                  : `<span class="badge badge-orange">À définir (1ère connexion)</span>`}</td>
                <td class="flex gap-8">
                  ${u.passwordHash ? `<button class="btn btn-sm btn-outline" onclick="resetUserPassword('${u.id}')">Réinitialiser</button>` : ""}
                  <button class="btn btn-sm btn-danger" onclick="deleteUser('${u.id}')">Supprimer</button>
                </td>
              </tr>
            `).join("")}
          </tbody>
        </table>
        <div class="text-muted mt-20">
          Un utilisateur ajouté ici devra faire sa « première connexion » (choix de son mot de passe
          personnel) directement sur la page de connexion. « Réinitialiser » efface son mot de passe
          actuel : il devra en choisir un nouveau à sa prochaine connexion.
        </div>
      </div>
    </div>

    <div class="grid-2 mt-20">
      <div class="card">
        <div class="card-title">Territoires</div>
        <div class="flex gap-8" style="flex-wrap:wrap;">
          ${DP.territoires.map(t => `<span class="badge badge-bleu">${t}</span>`).join("")}
        </div>
      </div>
      <div class="card">
        <div class="card-title">Référentiel des phases</div>
        <div class="flex gap-8" style="flex-wrap:wrap;">
          ${DP.phases.map(p => `<span class="badge ${dpPhaseBadgeClass(p)}">${p}</span>`).join("")}
        </div>
      </div>
    </div>

    <div class="card mt-20">
      <div class="card-title">Réinitialiser les données de démonstration</div>
      <div class="text-muted mb-14">Efface toutes les modifications locales et recharge le jeu de données d'exemple.</div>
      <button class="btn btn-danger" onclick="resetDemo()">Réinitialiser</button>
    </div>
  `;
}

function saveGithubCfg() {
  dpSaveGithubConfig({
    owner: document.getElementById("g-owner").value.trim(),
    repo: document.getElementById("g-repo").value.trim(),
    path: document.getElementById("g-path").value.trim() || "data.json",
    token: document.getElementById("g-token").value.trim()
  });
  dpMarkDirtyForSync();
  alert("Connexion GitHub enregistrée.");
}

async function loadNow() {
  const ok = await dpLoadFromGitHub();
  alert(ok ? "Données rechargées depuis le dépôt privé." : "Échec du chargement — vérifiez owner/repo/token.");
  if (ok) render();
}

function addUser() {
  const nom = prompt("Nom complet du nouvel utilisateur :");
  if (!nom) return;
  const identifiant = prompt("Identifiant de connexion (ex. p.durand) :");
  if (!identifiant) return;
  if (DP.utilisateurs.some(u => u.identifiant.toLowerCase() === identifiant.trim().toLowerCase())) {
    alert("Cet identifiant existe déjà.");
    return;
  }
  const role = prompt("Rôle (ex. Chargé d'opérations, Développement, Direction) :", "Chargé d'opérations") || "Collaborateur";
  DP.utilisateurs.push({
    id: dpUid("u"), nom: nom.trim(), identifiant: identifiant.trim().toLowerCase(),
    role, passwordHash: null, salt: null
  });
  dpPersist();
  render();
}

function resetUserPassword(id) {
  const u = DP.utilisateurs.find(u => u.id === id);
  if (!u) return;
  if (!confirm(`Réinitialiser le mot de passe de ${u.nom} ? Il/elle devra en choisir un nouveau à la prochaine connexion.`)) return;
  u.passwordHash = null;
  u.salt = null;
  dpPersist();
  render();
}

function deleteUser(id) {
  const u = DP.utilisateurs.find(u => u.id === id);
  if (!u) return;
  if (!confirm(`Supprimer l'utilisateur ${u.nom} ?`)) return;
  DP.utilisateurs = DP.utilisateurs.filter(x => x.id !== id);
  dpPersist();
  render();
}

function resetDemo() {
  if (!confirm("Toutes les données locales seront perdues. Continuer ?")) return;
  localStorage.removeItem(DP_STORAGE_KEY);
  window.location.reload();
}
</script>
</body>
</html>
