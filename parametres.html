<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Paramètres — DomPatrimoine</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<script src="app.js?v=3"></script>
<script>
const content = dpRenderShell("parametres", "Paramètres", "Utilisateurs, données locales et évolutions prévues");
if (content) render();

function render() {
  const cfg = dpGetGithubConfig() || {};
  content.innerHTML = `
    <div class="grid-2">
      <div class="card">
        <div class="card-title">Dépôt privé de données</div>
        <div class="text-muted mb-14">
          DomPatrimoine fonctionne avec <b>deux dépôts GitHub</b>, comme DomPilot : celui qui héberge
          cette application (public, servi par GitHub Pages) et un second, <b>privé</b>, qui contient
          uniquement le fichier <code>data.json</code>. Renseignez ci-dessous les coordonnées du dépôt
          <b>privé</b> uniquement.
        </div>
        <div class="login-error show" style="background:#fbeadb;color:var(--orange);">
          &#9888; Utilisez un <b>fine-grained token</b> limité à ce seul dépôt privé, avec uniquement les
          droits "Contents: Read and write", et évitez de partager cet écran ou les outils de
          développement du navigateur.
        </div>
        <div class="field"><label>Propriétaire du dépôt privé (owner)</label>
          <input id="g-owner" value="${dpEsc(cfg.owner || '')}" placeholder="ex. Domoimmo"></div>
        <div class="field"><label>Nom du dépôt privé</label>
          <input id="g-repo" value="${dpEsc(cfg.repo || '')}" placeholder="ex. dompatrimoine-data"></div>
        <div class="field"><label>Chemin du fichier de données</label>
          <input id="g-path" value="${dpEsc(cfg.path || 'data.json')}"></div>
        <div class="field"><label>Personal Access Token (fine-grained, ce dépôt uniquement)</label>
          <input id="g-token" type="password" value="${dpEsc(cfg.token || '')}" placeholder="github_pat_&hellip;"></div>
        <div style="display:flex;gap:8px;">
          <button class="btn btn-primary btn-sm" onclick="saveGithubCfg()">Enregistrer la connexion</button>
          <button class="btn btn-outline btn-sm" onclick="dpSyncWithGitHub()">Écrire maintenant</button>
          <button class="btn btn-outline btn-sm" onclick="loadNow()">Recharger depuis GitHub</button>
        </div>
      </div>
      <div class="card">
        <div class="card-title">Utilisateurs (démonstration)</div>
        <div class="text-muted mb-14">
          Authentification simplifiée pour ce prototype (identifiant seul, sans mot de passe). À remplacer par le
          même schéma que DomPilot/GESTOCK (hash + sel, ou SSO Domofrance) avant tout déploiement réel.
        </div>
        <table class="data-table">
          <thead><tr><th>Identifiant</th><th>Nom</th><th>Rôle</th><th>Droits</th></tr></thead>
          <tbody>
            ${DP.utilisateurs.map(u => `
              <tr><td>${dpEsc(u.identifiant)}</td><td>${dpEsc(u.nom)}</td><td>${dpEsc(u.role)}</td>
              <td>${u.isAdmin ? '<span class="badge badge-green">Admin</span>' : '<span class="badge badge-gray">Standard</span>'}</td></tr>
            `).join("")}
          </tbody>
        </table>
      </div>

      <div class="card">
        <div class="card-title">Données locales</div>
        <div class="text-muted mb-14">
          Les données affichées proviennent des fichiers fournis (surfaces des locaux administratifs, contrats de
          fonctionnement, annuaire des prestataires Bordeaux/Agen/Pau-Bayonne) et sont stockées dans le
          <code>localStorage</code> de ce navigateur. Toute modification faite dans l'app reste locale à cet appareil.
        </div>
        <div class="field-row">
          <div><span class="badge badge-blue">${DP.sites.length} sites</span></div>
          <div><span class="badge badge-blue">${DP.contrats.length} contrats</span></div>
          <div><span class="badge badge-blue">${DP.annuaire.length} contacts</span></div>
        </div>
        <div class="mt-18">
          <button class="btn btn-outline btn-sm" onclick="dpResetDemo()">Réinitialiser les données locales</button>
        </div>
      </div>
    </div>

    <div class="card mt-18">
      <div class="card-title">Évolutions prévues</div>
      <div class="text-muted" style="line-height:1.7;">
        &bull; Rattachement direct site &harr; contrats &harr; équipements, en s'appuyant sur le référentiel patrimoine détaillé (sites/bâtiments/niveaux/espaces/équipements) du modèle Camileia.<br>
        &bull; Suivi des échéances de contrats et alertes de renouvellement (les dates de fin de contrat ne sont pas présentes dans le fichier source actuel).<br>
        &bull; Authentification réelle (hash + sel comme GESTOCK/DomPilot, ou SSO).<br>
        &bull; Édition en ligne des fiches site / contrat / contact (le prototype est actuellement en lecture seule sur les données importées).
      </div>
    </div>
  `;
}

function saveGithubCfg() {
  dpSaveGithubConfig({
    owner: document.getElementById("g-owner").value.trim(),
    repo: document.getElementById("g-repo").value.trim(),
    path: document.getElementById("g-path").value.trim() || "data.json",
    token: document.getElementById("g-token").value.trim()
  });
  alert("Connexion enregistrée.");
  render();
}

async function loadNow() {
  const ok = await dpLoadFromGitHub();
  alert(ok ? "Données rechargées depuis le dépôt privé." : "Échec du chargement — vérifiez owner/repo/token.");
  if (ok) render();
}
</script>
</body>
</html>
