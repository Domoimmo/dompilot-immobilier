<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fiche opération — DomPilot</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<script src="app.js?v=7"></script>
<script>
const content = dpRenderShell("operations", "Fiche opération", "");
let OPID = new URLSearchParams(window.location.search).get("id");
let isNew = !OPID;
let op = isNew ? null : DP.operations.find(o => o.id === OPID);

if (content) {
  if (!isNew && !op) {
    content.innerHTML = `<div class="empty-state">Opération introuvable. <a href="operations.html">Retour à la liste</a></div>`;
  } else {
    render();
  }
}

function blankOp() {
  return {
    id: dpUid("pr"), nom: "", commune: "", territoire: DP.territoires[0],
    typeOperation: DP.typesOperation[0], natureProduit: DP.naturesProduit[0],
    phase: "Développement", responsable: DP.utilisateurs[0].identifiant, surfaceLocative: 0,
    budgetPrevisionnel: 0, budgetEngage: 0, valeurVenale: 0, chargesNonRecuperablesAnnuelles: 0,
    dateSignatureFoncier: "", dateLivraisonPrevue: "", latitude: null, longitude: null,
    jalons: DP.jalonsTypes.map(j => ({ libelle: j, date: "", statut: "attente" })),
    taches: [], comptesRendus: [], baux: [], conformite: [], risques: [], contacts: [], contrats: []
  };
}

function render() {
  const o = isNew ? blankOp() : op;

  document.querySelector(".topbar h1").textContent = isNew ? "Nouvelle opération" : o.nom;
  document.querySelector(".topbar-sub") ?.remove();
  const subEl = document.createElement("div");
  subEl.className = "topbar-sub";
  subEl.textContent = isNew ? "Créez une fiche opération" : `${o.commune} · ${o.territoire}`;
  document.querySelector(".topbar h1").insertAdjacentElement("afterend", subEl);

  const budgetPct = o.budgetPrevisionnel ? Math.min(100, Math.round((o.budgetEngage / o.budgetPrevisionnel) * 100)) : 0;

  content.innerHTML = `
    <div class="toolbar">
      <a href="operations.html" class="btn btn-outline btn-sm">← Retour à la liste</a>
      <div class="flex gap-8">
        ${!isNew ? `<button class="btn btn-danger" onclick="deleteOp()">Supprimer l'opération</button>` : ""}
        <button class="btn btn-primary" onclick="saveInfos()">💾 Enregistrer</button>
      </div>
    </div>

    ${!isNew ? `
    <div class="kpi-grid" style="margin-bottom:18px;">
      <div class="kpi-card"><div class="kpi-label">Phase</div>
        <div class="kpi-value" style="font-size:16px;"><span class="badge ${dpPhaseBadgeClass(o.phase)}">${o.phase}</span></div></div>
      <div class="kpi-card"><div class="kpi-label">Surface locative</div><div class="kpi-value" style="font-size:20px;">${dpFormatSurface(o.surfaceLocative)}</div></div>
      <div class="kpi-card"><div class="kpi-label">Budget engagé</div>
        <div class="kpi-value" style="font-size:20px;">${budgetPct}%</div>
        <div class="progress-bar" style="margin-top:8px;"><div class="progress-bar-fill" style="width:${budgetPct}%;"></div></div>
      </div>
      ${o.phase === "Exploitation"
        ? `<div class="kpi-card"><div class="kpi-label">Taux d'occupation</div><div class="kpi-value">${dpTauxOccupation(o) ?? "—"}%</div></div>`
        : `<div class="kpi-card"><div class="kpi-label">Livraison prévue</div><div class="kpi-value" style="font-size:18px;">${dpFormatDate(o.dateLivraisonPrevue)}</div></div>`}
    </div>` : ""}

    <div class="tabs">
      <div class="tab-btn active" data-tab="infos" onclick="switchTab('infos')">Infos générales</div>
      <div class="tab-btn" data-tab="planning" onclick="switchTab('planning')">Planning &amp; jalons</div>
      <div class="tab-btn" data-tab="finances" onclick="switchTab('finances')">Suivi financier</div>
      <div class="tab-btn" data-tab="locatif" onclick="switchTab('locatif')">Locataires &amp; baux</div>
      <div class="tab-btn" data-tab="conformite" onclick="switchTab('conformite')">Conformité &amp; risques</div>
      <div class="tab-btn" data-tab="taches" onclick="switchTab('taches')">Tâches &amp; comptes rendus</div>
    </div>

    <div class="tab-panel active" id="tab-infos">${renderInfosTab(o)}</div>
    <div class="tab-panel" id="tab-planning">${renderPlanningTab(o)}</div>
    <div class="tab-panel" id="tab-finances">${renderFinancesTab(o)}</div>
    <div class="tab-panel" id="tab-locatif">${renderLocatifTab(o)}</div>
    <div class="tab-panel" id="tab-conformite">${renderConformiteTab(o)}</div>
    <div class="tab-panel" id="tab-taches">${renderTachesTab(o)}</div>
  `;
}

function switchTab(tab) {
  document.querySelectorAll(".tab-btn").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
  document.querySelectorAll(".tab-panel").forEach(p => p.classList.toggle("active", p.id === "tab-" + tab));
}

/* ---------------- Onglet Infos ---------------- */
function renderInfosTab(o) {
  return `
    <div class="card">
      <div class="field"><label>Nom de l'opération</label><input id="i-nom" value="${o.nom}" placeholder="ex. Résidence Les Lauriers"></div>
      <div class="field-row">
        <div class="field"><label>Commune</label><input id="i-commune" value="${o.commune}"></div>
        <div class="field"><label>Territoire</label>
          <select id="i-territoire">${DP.territoires.map(t => `<option ${o.territoire===t?"selected":""}>${t}</option>`).join("")}</select></div>
      </div>
      <div class="field-row">
        <div class="field"><label>Type d'opération</label>
          <select id="i-type">${DP.typesOperation.map(t => `<option ${o.typeOperation===t?"selected":""}>${t}</option>`).join("")}</select></div>
        <div class="field"><label>Nature du produit</label>
          <select id="i-nature">${DP.naturesProduit.map(t => `<option ${o.natureProduit===t?"selected":""}>${t}</option>`).join("")}</select></div>
      </div>
      <div class="field-row">
        <div class="field"><label>Phase</label>
          <select id="i-phase">${DP.phases.map(p => `<option ${o.phase===p?"selected":""}>${p}</option>`).join("")}</select></div>
        <div class="field"><label>Responsable de l'opération</label>
          <select id="i-responsable">${DP.utilisateurs.map(u => `<option value="${u.identifiant}" ${o.responsable===u.identifiant?"selected":""}>${u.nom}</option>`).join("")}</select></div>
      </div>
      <div class="field-row">
        <div class="field"><label>Surface locative (m²)</label><input id="i-surface" type="number" value="${o.surfaceLocative}"></div>
        <div class="field"><label>Date de livraison prévue</label><input id="i-livraison" type="date" value="${o.dateLivraisonPrevue}"></div>
      </div>
      <div class="card-title" style="margin-top:16px;font-size:13px;">Localisation (pour la carte)</div>
      <div class="field-row">
        <div class="field"><label>Latitude</label><input id="i-lat" type="number" step="0.000001" value="${o.latitude ?? ""}" placeholder="ex. 44.837789"></div>
        <div class="field"><label>Longitude</label><input id="i-lng" type="number" step="0.000001" value="${o.longitude ?? ""}" placeholder="ex. -0.579180"></div>
      </div>
      <button type="button" class="btn btn-sm btn-outline" onclick="geocodeCommune()">📍 Localiser automatiquement depuis la commune</button>
      <span class="text-muted" id="geocode-status" style="margin-left:8px;"></span>
    </div>

    <div class="card mt-20">
      <div class="flex-between mb-14">
        <div class="card-title mt-0" style="margin:0;">Contacts clés</div>
        <button class="btn btn-sm btn-outline" onclick="addContact()">+ Ajouter</button>
      </div>
      ${(o.contacts || []).length === 0 ? `<div class="empty-state">Aucun contact enregistré (notaire, syndic, entreprise, mairie…).</div>` : `
      <table>
        <thead><tr><th>Rôle</th><th>Nom</th><th>Coordonnées</th><th></th></tr></thead>
        <tbody>
          ${o.contacts.map((c, idx) => `
            <tr><td>${c.role}</td><td>${c.nom}</td><td>${c.coordonnees || "—"}</td>
              <td><button class="btn btn-sm btn-danger" onclick="deleteContact(${idx})">Suppr.</button></td></tr>
          `).join("")}
        </tbody>
      </table>`}
    </div>
  `;
}

function collectInfosFromForm(o) {
  o.nom = document.getElementById("i-nom").value.trim();
  o.commune = document.getElementById("i-commune").value.trim();
  o.territoire = document.getElementById("i-territoire").value;
  o.typeOperation = document.getElementById("i-type").value;
  o.natureProduit = document.getElementById("i-nature").value;
  o.phase = document.getElementById("i-phase").value;
  o.responsable = document.getElementById("i-responsable").value;
  o.surfaceLocative = parseInt(document.getElementById("i-surface").value) || 0;
  o.dateLivraisonPrevue = document.getElementById("i-livraison").value;
  const latVal = document.getElementById("i-lat").value;
  const lngVal = document.getElementById("i-lng").value;
  o.latitude = latVal ? parseFloat(latVal) : null;
  o.longitude = lngVal ? parseFloat(lngVal) : null;
}

// Géocodage gratuit via Nominatim (OpenStreetMap) — pas de clé API requise.
// Usage raisonnable uniquement (1 requête à la fois, sur clic utilisateur) : voir
// https://operations.osmfoundation.org/policies/nominatim/
async function geocodeCommune() {
  const commune = document.getElementById("i-commune").value.trim();
  const statusEl = document.getElementById("geocode-status");
  if (!commune) { statusEl.textContent = "Renseignez d'abord la commune."; return; }
  statusEl.textContent = "Recherche…";
  try {
    const q = encodeURIComponent(commune + ", France");
    const resp = await fetch(`https://nominatim.openstreetmap.org/search?format=json&limit=1&q=${q}`);
    const results = await resp.json();
    if (!results.length) { statusEl.textContent = "Commune introuvable — saisissez les coordonnées manuellement."; return; }
    document.getElementById("i-lat").value = parseFloat(results[0].lat).toFixed(6);
    document.getElementById("i-lng").value = parseFloat(results[0].lon).toFixed(6);
    statusEl.textContent = "✓ Coordonnées trouvées (n'oubliez pas d'Enregistrer).";
  } catch (e) {
    statusEl.textContent = "Erreur de géocodage — saisissez les coordonnées manuellement.";
  }
}

function addContact() {
  if (isNew) return;
  const role = prompt("Rôle (ex. Notaire, Syndic, Entreprise générale, Mairie…) :");
  if (!role) return;
  const nom = prompt("Nom / raison sociale :");
  if (!nom) return;
  const coordonnees = prompt("Coordonnées (téléphone, email…), optionnel :") || "";
  op.contacts = op.contacts || [];
  op.contacts.push({ role, nom, coordonnees });
  dpPersist();
  render();
  switchTab("infos");
}
function deleteContact(idx) {
  if (!confirm("Supprimer ce contact ?")) return;
  op.contacts.splice(idx, 1);
  dpPersist();
  render();
  switchTab("infos");
}

function saveInfos() {
  const o = isNew ? blankOp() : op;
  collectInfosFromForm(o);
  if (!o.nom) { alert("Le nom de l'opération est requis."); switchTab("infos"); return; }

  if (isNew) {
    DP.operations.push(o);
    dpPersist();
    window.location.href = "operation.html?id=" + o.id;
  } else {
    dpPersist();
    render();
    switchTab("infos");
  }
}

/* ---------------- Onglet Planning / jalons ---------------- */
function renderPlanningTab(o) {
  if (isNew) return `<div class="empty-state">Enregistrez d'abord la fiche pour gérer le planning.</div>`;
  const items = (o.jalons || []).map((j, idx) => `
    <li class="${j.statut === 'fait' ? 'done' : j.statut === 'encours' ? 'current' : ''}">
      <div class="dot"></div>
      <div style="flex:1;">
        <div class="tl-title">${j.libelle}</div>
        <div class="tl-date">${dpFormatDate(j.date)}</div>
      </div>
      <select onchange="updateJalonStatut(${idx}, this.value)" style="width:120px;">
        <option value="attente" ${j.statut==='attente'?'selected':''}>À venir</option>
        <option value="encours" ${j.statut==='encours'?'selected':''}>En cours</option>
        <option value="fait" ${j.statut==='fait'?'selected':''}>Fait</option>
      </select>
      <input type="date" value="${j.date}" style="width:150px;margin-left:8px;" onchange="updateJalonDate(${idx}, this.value)">
    </li>
  `).join("");
  return `
    <div class="card">
      <div class="card-title">Jalons de l'opération</div>
      <ul class="timeline">${items || '<div class="empty-state">Aucun jalon défini.</div>'}</ul>
    </div>
  `;
}
function updateJalonStatut(idx, val) { op.jalons[idx].statut = val; dpPersist(); }
function updateJalonDate(idx, val) { op.jalons[idx].date = val; dpPersist(); }

/* ---------------- Onglet Finances ---------------- */
function renderFinancesTab(o) {
  if (isNew) return `<div class="empty-state">Enregistrez d'abord la fiche pour gérer le budget.</div>`;
  const pct = o.budgetPrevisionnel ? Math.min(100, Math.round((o.budgetEngage / o.budgetPrevisionnel) * 100)) : 0;
  const trlb = dpTRLB(o), trln = dpTRLN(o);
  return `
    <div class="card">
      <div class="card-title">Budget global</div>
      <div class="field-row">
        <div class="field"><label>Budget prévisionnel (€)</label>
          <input id="f-budget-prev" type="number" value="${o.budgetPrevisionnel}" onchange="updateBudget()"></div>
        <div class="field"><label>Budget engagé (€)</label>
          <input id="f-budget-eng" type="number" value="${o.budgetEngage}" onchange="updateBudget()"></div>
      </div>
      <div style="margin-top:6px;">
        <div class="flex-between" style="font-size:12.5px;margin-bottom:4px;">
          <span>Taux d'engagement</span><span class="text-muted">${pct}%</span>
        </div>
        <div class="progress-bar"><div class="progress-bar-fill" style="width:${pct}%;"></div></div>
      </div>
    </div>

    <div class="card mt-20">
      <div class="card-title">Rentabilité locative</div>
      <div class="text-muted mb-14">Indicateurs calculés à partir des baux actifs (onglet Locataires &amp; baux) et de la valeur vénale estimée.</div>
      <div class="field-row">
        <div class="field"><label>Valeur vénale estimée (€)</label>
          <input id="f-valeur" type="number" value="${o.valeurVenale}" onchange="updateRenta()"></div>
        <div class="field"><label>Charges non récupérables annuelles (€)</label>
          <input id="f-charges" type="number" value="${o.chargesNonRecuperablesAnnuelles}" onchange="updateRenta()"></div>
      </div>
      <div class="grid-2">
        <div class="kpi-card"><div class="kpi-label">TRLB (taux de rendement locatif brut)</div>
          <div class="kpi-value" style="font-size:22px;">${trlb === null ? "—" : trlb + "%"}</div></div>
        <div class="kpi-card"><div class="kpi-label">TRLN (taux de rendement locatif net)</div>
          <div class="kpi-value" style="font-size:22px;">${trln === null ? "—" : trln + "%"}</div></div>
      </div>
    </div>

    <div class="card mt-20">
      <div class="flex-between mb-14">
        <div class="card-title mt-0" style="margin:0;">Contrats de service</div>
        <button class="btn btn-sm btn-accent" onclick="addContrat()">+ Ajouter un contrat</button>
      </div>
      ${renderContratsBlock(o)}
    </div>

    <div class="card mt-20">
      <div class="card-title">Postes de dépense de référence</div>
      <div class="text-muted mb-14">Répartition indicative — à affiner poste par poste lors du bilan d'opération.</div>
      <table>
        <thead><tr><th>Poste</th><th>Part indicative</th></tr></thead>
        <tbody>
          ${DP.postesBudget.map((p, i) => `
            <tr><td>${p}</td><td><span class="badge badge-bleu">${Math.round(100/DP.postesBudget.length)}%</span></td></tr>
          `).join("")}
        </tbody>
      </table>
    </div>
  `;
}
function updateRenta() {
  op.valeurVenale = parseFloat(document.getElementById("f-valeur").value) || 0;
  op.chargesNonRecuperablesAnnuelles = parseFloat(document.getElementById("f-charges").value) || 0;
  dpPersist();
  render();
  switchTab("finances");
}

/* ---------------- Contrats de service (dans l'onglet Finances) ---------------- */
function renderContratsBlock(o) {
  const contrats = o.contrats || [];
  const budgetTotal = dpBudgetContratsTotal(o);
  const parType = dpBudgetContratsParType(o);
  const maxType = Math.max(1, ...Object.values(parType));

  const table = contrats.length === 0 ? `<div class="empty-state">Aucun contrat enregistré.</div>` : `
    <table>
      <thead><tr><th>Type</th><th>Prestataire</th><th>Montant annuel</th><th>Périodicité</th><th>Renouvellement</th><th>Statut</th><th></th></tr></thead>
      <tbody>
        ${contrats.map((c, idx) => `
          <tr>
            <td>${c.type}</td>
            <td>${c.prestataire || "—"}</td>
            <td>${dpFormatEUR(c.montantAnnuel)}</td>
            <td>${c.periodicite}</td>
            <td>${dpFormatDate(c.dateRenouvellement)}</td>
            <td><span class="badge ${dpStatutContratBadgeClass(c.statut)}">${c.statut}</span></td>
            <td class="flex gap-8">
              <button class="btn btn-sm btn-outline" onclick="editContrat(${idx})">Modifier</button>
              <button class="btn btn-sm btn-danger" onclick="deleteContrat(${idx})">Suppr.</button>
            </td>
          </tr>
        `).join("")}
      </tbody>
    </table>`;

  const repartition = Object.keys(parType).length === 0 ? "" : `
    <div class="mt-20">
      <div class="flex-between mb-14"><strong style="font-size:13px;">Répartition du budget par type de contrat</strong>
        <span class="text-muted">Total : ${dpFormatEUR(budgetTotal)} / an</span></div>
      ${Object.entries(parType).map(([type, montant]) => `
        <div style="margin-bottom:10px;">
          <div class="flex-between" style="font-size:12.5px;margin-bottom:4px;">
            <span>${type}</span><span class="text-muted">${dpFormatEUR(montant)}</span>
          </div>
          <div class="progress-bar"><div class="progress-bar-fill" style="width:${(montant/maxType)*100}%;background:var(--bleu);"></div></div>
        </div>
      `).join("")}
    </div>`;

  return table + repartition;
}

function blankContrat() {
  return { type: DP.typesContrat[0], prestataire: "", montantAnnuel: 0,
    periodicite: DP.periodicitesContrat[2], dateRenouvellement: "", statut: "Actif" };
}

function addContrat() { openContratModal(null); }
function editContrat(idx) { openContratModal(idx); }

function openContratModal(idx) {
  const c = idx !== null ? op.contrats[idx] : blankContrat();
  const overlay = document.createElement("div");
  overlay.className = "modal-overlay open";
  overlay.innerHTML = `
    <div class="modal">
      <div class="modal-header">
        <h3>${idx !== null ? "Modifier le contrat" : "Nouveau contrat de service"}</h3>
        <button class="modal-close" onclick="closeContratModal()">✕</button>
      </div>
      <div class="field"><label>Type de contrat</label>
        <select id="c-type">${DP.typesContrat.map(t => `<option ${c.type===t?"selected":""}>${t}</option>`).join("")}</select></div>
      <div class="field"><label>Prestataire</label><input id="c-prestataire" value="${c.prestataire}" placeholder="ex. Otis, Onet, ISS…"></div>
      <div class="field-row">
        <div class="field"><label>Montant annuel (€)</label><input id="c-montant" type="number" value="${c.montantAnnuel}"></div>
        <div class="field"><label>Périodicité de facturation</label>
          <select id="c-periodicite">${DP.periodicitesContrat.map(p => `<option ${c.periodicite===p?"selected":""}>${p}</option>`).join("")}</select></div>
      </div>
      <div class="field-row">
        <div class="field"><label>Date de renouvellement</label><input id="c-renouvellement" type="date" value="${c.dateRenouvellement}"></div>
        <div class="field"><label>Statut</label>
          <select id="c-statut">${DP.statutsContrat.map(s => `<option ${c.statut===s?"selected":""}>${s}</option>`).join("")}</select></div>
      </div>
      <div class="flex gap-8" style="justify-content:flex-end;margin-top:10px;">
        <button class="btn btn-outline" onclick="closeContratModal()">Annuler</button>
        <button class="btn btn-primary" onclick="saveContrat(${idx})">Enregistrer</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
}
function closeContratModal() { document.querySelectorAll(".modal-overlay").forEach(m => m.remove()); }

function saveContrat(idx) {
  const data = {
    type: document.getElementById("c-type").value,
    prestataire: document.getElementById("c-prestataire").value.trim(),
    montantAnnuel: parseFloat(document.getElementById("c-montant").value) || 0,
    periodicite: document.getElementById("c-periodicite").value,
    dateRenouvellement: document.getElementById("c-renouvellement").value,
    statut: document.getElementById("c-statut").value
  };
  op.contrats = op.contrats || [];
  if (idx !== null) { Object.assign(op.contrats[idx], data); }
  else { op.contrats.push(data); }
  dpPersist();
  closeContratModal();
  render();
  switchTab("finances");
}
function deleteContrat(idx) {
  if (!confirm("Supprimer ce contrat ?")) return;
  op.contrats.splice(idx, 1);
  dpPersist();
  render();
  switchTab("finances");
}
function updateBudget() {
  op.budgetPrevisionnel = parseFloat(document.getElementById("f-budget-prev").value) || 0;
  op.budgetEngage = parseFloat(document.getElementById("f-budget-eng").value) || 0;
  dpPersist();
  render();
  switchTab("finances");
}

/* ---------------- Onglet Locataires & baux ---------------- */
function renderLocatifTab(o) {
  if (isNew) return `<div class="empty-state">Enregistrez d'abord la fiche pour gérer les baux.</div>`;
  if (o.phase !== "Exploitation") {
    return `<div class="empty-state">
      Cet onglet se remplit une fois l'opération passée en phase <b>Exploitation</b>
      (actif livré, en gestion locative). Vous pouvez toutefois déjà saisir des baux en
      anticipation de la livraison si besoin.
      <div class="mt-20"><button class="btn btn-outline btn-sm" onclick="addBail()">+ Ajouter un bail quand même</button></div>
    </div>` + renderBauxTable(o);
  }
  const occ = dpTauxOccupation(o);
  const loyerTotal = dpLoyerAnnuelTotal(o);
  return `
    <div class="kpi-grid" style="margin-bottom:18px;">
      <div class="kpi-card"><div class="kpi-label">Taux d'occupation</div><div class="kpi-value">${occ ?? "—"}%</div>
        ${occ !== null ? `<div class="progress-bar" style="margin-top:8px;"><div class="progress-bar-fill" style="width:${occ}%;"></div></div>` : ""}
      </div>
      <div class="kpi-card"><div class="kpi-label">Surface louée</div><div class="kpi-value" style="font-size:20px;">${dpFormatSurface(dpSurfaceLouee(o))}</div></div>
      <div class="kpi-card"><div class="kpi-label">Loyers annualisés (HT)</div><div class="kpi-value" style="font-size:20px;">${dpFormatEUR(loyerTotal)}</div></div>
    </div>
    ${renderBauxTable(o)}
  `;
}

function renderBauxTable(o) {
  const baux = o.baux || [];
  return `
    <div class="card">
      <div class="flex-between mb-14">
        <div class="card-title mt-0" style="margin:0;">Baux</div>
        <button class="btn btn-sm btn-accent" onclick="addBail()">+ Ajouter un bail</button>
      </div>
      ${baux.length === 0 ? `<div class="empty-state">Aucun bail enregistré.</div>` : `
      <table>
        <thead><tr><th>Locataire</th><th>Surface</th><th>Loyer annuel HT</th><th>Type de bail</th><th>Échéance</th><th>Statut</th><th></th></tr></thead>
        <tbody>
          ${baux.map((b, idx) => {
            const jours = dpJoursAvantEcheance(b.dateEcheance);
            const echeanceProche = jours !== null && jours <= 182 && b.statut !== "Vacant";
            return `
            <tr>
              <td><strong>${b.locataire}</strong>${b.activite ? `<br><span class="text-muted">${b.activite}</span>` : ""}</td>
              <td>${dpFormatSurface(b.surfaceM2)}</td>
              <td>${dpFormatEUR(b.loyerAnnuelHT)}</td>
              <td>${b.typeBail || "—"}</td>
              <td>${dpFormatDate(b.dateEcheance)} ${echeanceProche ? `<span class="badge badge-orange">≤ 6 mois</span>` : ""}</td>
              <td><span class="badge ${dpStatutBailBadgeClass(b.statut)}">${b.statut}</span></td>
              <td class="flex gap-8">
                <button class="btn btn-sm btn-outline" onclick="editBail(${idx})">Modifier</button>
                <button class="btn btn-sm btn-danger" onclick="deleteBail(${idx})">Suppr.</button>
              </td>
            </tr>
          `; }).join("")}
        </tbody>
      </table>`}
    </div>
  `;
}

function blankBail() {
  return { locataire: "", activite: "", surfaceM2: 0, loyerAnnuelHT: 0, dateEffet: "", dateEcheance: "",
    typeBail: DP.typesBail[0], indexation: DP.indexations[0], statut: "Actif" };
}

function addBail() { openBailModal(null); }
function editBail(idx) { openBailModal(idx); }

function openBailModal(idx) {
  const bail = idx !== null ? op.baux[idx] : blankBail();
  const overlay = document.createElement("div");
  overlay.className = "modal-overlay open";
  overlay.innerHTML = `
    <div class="modal">
      <div class="modal-header">
        <h3>${idx !== null ? "Modifier le bail" : "Nouveau bail"}</h3>
        <button class="modal-close" onclick="closeBailModal()">✕</button>
      </div>
      <div class="field-row">
        <div class="field"><label>Locataire</label><input id="b-locataire" value="${bail.locataire}" placeholder="ex. Cabinet Dupont & Associés"></div>
        <div class="field"><label>Activité</label><input id="b-activite" value="${bail.activite}" placeholder="ex. Conseil, Restauration…"></div>
      </div>
      <div class="field-row">
        <div class="field"><label>Surface louée (m²)</label><input id="b-surface" type="number" value="${bail.surfaceM2}"></div>
        <div class="field"><label>Loyer annuel HT (€)</label><input id="b-loyer" type="number" value="${bail.loyerAnnuelHT}"></div>
      </div>
      <div class="field-row">
        <div class="field"><label>Type de bail</label>
          <select id="b-type">${DP.typesBail.map(t => `<option ${bail.typeBail===t?"selected":""}>${t}</option>`).join("")}</select></div>
        <div class="field"><label>Indexation</label>
          <select id="b-indexation">${DP.indexations.map(t => `<option ${bail.indexation===t?"selected":""}>${t}</option>`).join("")}</select></div>
      </div>
      <div class="field-row">
        <div class="field"><label>Date de prise d'effet</label><input id="b-effet" type="date" value="${bail.dateEffet}"></div>
        <div class="field"><label>Échéance (fin de bail / triennale)</label><input id="b-echeance" type="date" value="${bail.dateEcheance}"></div>
      </div>
      <div class="field"><label>Statut</label>
        <select id="b-statut">${DP.statutsBail.map(s => `<option ${bail.statut===s?"selected":""}>${s}</option>`).join("")}</select></div>
      <div class="flex gap-8" style="justify-content:flex-end;margin-top:10px;">
        <button class="btn btn-outline" onclick="closeBailModal()">Annuler</button>
        <button class="btn btn-primary" onclick="saveBail(${idx})">Enregistrer</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
}

function closeBailModal() { document.querySelectorAll(".modal-overlay").forEach(m => m.remove()); }

function saveBail(idx) {
  const data = {
    locataire: document.getElementById("b-locataire").value.trim(),
    activite: document.getElementById("b-activite").value.trim(),
    surfaceM2: parseFloat(document.getElementById("b-surface").value) || 0,
    loyerAnnuelHT: parseFloat(document.getElementById("b-loyer").value) || 0,
    typeBail: document.getElementById("b-type").value,
    indexation: document.getElementById("b-indexation").value,
    dateEffet: document.getElementById("b-effet").value,
    dateEcheance: document.getElementById("b-echeance").value,
    statut: document.getElementById("b-statut").value
  };
  if (!data.locataire) { alert("Le nom du locataire est requis."); return; }
  op.baux = op.baux || [];
  if (idx !== null) { Object.assign(op.baux[idx], data); }
  else { op.baux.push(data); }
  dpPersist();
  closeBailModal();
  render();
  switchTab("locatif");
}

function deleteBail(idx) {
  if (!confirm("Supprimer ce bail ?")) return;
  op.baux.splice(idx, 1);
  dpPersist();
  render();
  switchTab("locatif");
}

/* ---------------- Onglet Conformité & risques ---------------- */
function renderConformiteTab(o) {
  if (isNew) return `<div class="empty-state">Enregistrez d'abord la fiche pour suivre la conformité et les risques.</div>`;
  const conformite = o.conformite || [];
  const risques = o.risques || [];
  return `
    <div class="grid-2">
      <div class="card">
        <div class="flex-between mb-14">
          <div class="card-title mt-0" style="margin:0;">Diagnostics &amp; conformité réglementaire</div>
          <button class="btn btn-sm btn-outline" onclick="addConformite()">+ Ajouter</button>
        </div>
        ${conformite.length === 0 ? `<div class="empty-state">Aucun diagnostic enregistré.</div>` : `
        <table>
          <thead><tr><th>Diagnostic</th><th>Échéance</th><th>Statut</th><th></th></tr></thead>
          <tbody>
            ${conformite.map((c, idx) => {
              const jours = dpJoursAvantEcheance(c.dateEcheance);
              const proche = jours !== null && jours <= 182;
              return `
              <tr>
                <td>${c.libelle}</td>
                <td>${dpFormatDate(c.dateEcheance)} ${proche ? `<span class="badge badge-orange">≤ 6 mois</span>` : ""}</td>
                <td><select onchange="updateConformiteStatut(${idx}, this.value)">
                  ${DP.statutsConformite.map(s => `<option ${c.statut===s?"selected":""}>${s}</option>`).join("")}
                </select></td>
                <td><button class="btn btn-sm btn-danger" onclick="deleteConformite(${idx})">Suppr.</button></td>
              </tr>`;
            }).join("")}
          </tbody>
        </table>`}
      </div>

      <div class="card">
        <div class="flex-between mb-14">
          <div class="card-title mt-0" style="margin:0;">Risques identifiés</div>
          <button class="btn btn-sm btn-outline" onclick="addRisque()">+ Ajouter</button>
        </div>
        ${risques.length === 0 ? `<div class="empty-state">Aucun risque enregistré.</div>` : `
        <table>
          <thead><tr><th>Risque</th><th>Niveau</th><th>Statut</th><th></th></tr></thead>
          <tbody>
            ${risques.map((r, idx) => `
              <tr>
                <td>${r.libelle}${r.commentaire ? `<br><span class="text-muted">${r.commentaire}</span>` : ""}</td>
                <td><span class="badge ${dpNiveauRisqueBadgeClass(r.niveau)}">${r.niveau}</span></td>
                <td><select onchange="updateRisqueStatut(${idx}, this.value)">
                  ${DP.statutsRisque.map(s => `<option ${r.statut===s?"selected":""}>${s}</option>`).join("")}
                </select></td>
                <td><button class="btn btn-sm btn-danger" onclick="deleteRisque(${idx})">Suppr.</button></td>
              </tr>
            `).join("")}
          </tbody>
        </table>`}
      </div>
    </div>
  `;
}

function addConformite() {
  const libelle = prompt("Type de diagnostic (ex. " + DP.typesConformite.join(", ") + ") :", DP.typesConformite[0]);
  if (!libelle) return;
  const dateEcheance = prompt("Date d'échéance / prochaine visite (AAAA-MM-JJ) :") || "";
  op.conformite = op.conformite || [];
  op.conformite.push({ libelle, dateEcheance, statut: "À jour" });
  dpPersist(); render(); switchTab("conformite");
}
function updateConformiteStatut(idx, val) { op.conformite[idx].statut = val; dpPersist(); }
function deleteConformite(idx) {
  if (!confirm("Supprimer ce diagnostic ?")) return;
  op.conformite.splice(idx, 1);
  dpPersist(); render(); switchTab("conformite");
}

function addRisque() {
  const libelle = prompt("Intitulé du risque (ex. Retard permis de construire, Locataire en difficulté financière…) :");
  if (!libelle) return;
  const niveau = prompt("Niveau (Faible / Moyen / Élevé) :", "Moyen") || "Moyen";
  const commentaire = prompt("Commentaire / plan de mitigation, optionnel :") || "";
  op.risques = op.risques || [];
  op.risques.push({ libelle, niveau: DP.niveauxRisque.includes(niveau) ? niveau : "Moyen", statut: "Identifié", commentaire });
  dpPersist(); render(); switchTab("conformite");
}
function updateRisqueStatut(idx, val) { op.risques[idx].statut = val; dpPersist(); }
function deleteRisque(idx) {
  if (!confirm("Supprimer ce risque ?")) return;
  op.risques.splice(idx, 1);
  dpPersist(); render(); switchTab("conformite");
}

/* ---------------- Onglet Tâches & CR ---------------- */
function renderTachesTab(o) {
  if (isNew) return `<div class="empty-state">Enregistrez d'abord la fiche pour ajouter des tâches.</div>`;
  const taches = (o.taches || []).map((t, idx) => `
    <div class="flex-between" style="padding:9px 0;border-bottom:1px solid var(--gris-bordure);">
      <label style="display:flex;align-items:center;gap:9px;font-weight:400;margin:0;">
        <input type="checkbox" style="width:auto;" ${t.fait ? "checked" : ""} onchange="toggleTache(${idx})">
        <span style="${t.fait ? 'text-decoration:line-through;color:#8393a3;' : ''}">${t.titre}</span>
      </label>
      <span class="text-muted">${dpFormatDate(t.echeance)}</span>
    </div>
  `).join("") || `<div class="empty-state">Aucune tâche.</div>`;

  const crs = (o.comptesRendus || []).slice().reverse().map(c => `
    <div style="padding:10px 0;border-bottom:1px solid var(--gris-bordure);">
      <div class="flex-between"><strong style="font-size:13px;">${dpUserName(c.auteur)}</strong><span class="text-muted">${dpFormatDate(c.date)}</span></div>
      <div style="font-size:13.5px;margin-top:4px;">${c.texte}</div>
    </div>
  `).join("") || `<div class="empty-state">Aucun compte rendu.</div>`;

  return `
    <div class="grid-2">
      <div class="card">
        <div class="flex-between mb-14">
          <div class="card-title mt-0" style="margin:0;">Tâches</div>
          <button class="btn btn-sm btn-outline" onclick="addTache()">+ Ajouter</button>
        </div>
        ${taches}
      </div>
      <div class="card">
        <div class="flex-between mb-14">
          <div class="card-title mt-0" style="margin:0;">Comptes rendus</div>
          <button class="btn btn-sm btn-outline" onclick="addCR()">+ Ajouter</button>
        </div>
        ${crs}
      </div>
    </div>
  `;
}
function toggleTache(idx) { op.taches[idx].fait = !op.taches[idx].fait; dpPersist(); render(); switchTab("taches"); }
function addTache() {
  const titre = prompt("Intitulé de la tâche :");
  if (!titre) return;
  const echeance = prompt("Échéance (AAAA-MM-JJ), optionnel :") || "";
  op.taches.push({ titre, echeance, fait: false });
  dpPersist(); render(); switchTab("taches");
}
function addCR() {
  const texte = prompt("Contenu du compte rendu :");
  if (!texte) return;
  const session = dpGetSession();
  op.comptesRendus.push({ date: new Date().toISOString().slice(0,10), auteur: session.identifiant, texte });
  dpPersist(); render(); switchTab("taches");
}

/* ---------------- Suppression ---------------- */
function deleteOp() {
  if (!confirm("Supprimer définitivement cette opération ?")) return;
  DP.operations = DP.operations.filter(o => o.id !== op.id);
  dpPersist();
  window.location.href = "operations.html";
}
</script>
</body>
</html>
