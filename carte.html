<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carte — DomPatrimoine</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
</head>
<body>
<script src="app.js?v=16"></script>
<script>
let map, markersLayer, mapReady = false;
let isGeocoding = false;

const CARTE_CATEGORY_COLOR = {
  "Siège social": "#c94f4f",
  "Agence": "#0f4c81",
  "Direction territoriale": "#e08a2c",
  "Bureau de gestion": "#1f8a70",
  "Locaux gardien": "#8a97a6"
};

const content = dpRenderShell("carte", "Carte du patrimoine", "Localisation des sites Domofrance à partir de leur adresse");
if (content) render();

function render() {
  if (!mapReady) {
    content.innerHTML = `
      <div class="filter-bar">
        <div class="text-muted" id="geocode-status">Initialisation de la carte&hellip;</div>
        <div class="filter-count">
          <span class="badge badge-red">&#9679; Siège social</span>
          <span class="badge badge-blue">&#9679; Agence</span>
          <span class="badge badge-orange">&#9679; Direction territoriale</span>
          <span class="badge badge-green">&#9679; Bureau de gestion</span>
          <span class="badge badge-gray">&#9679; Locaux gardien</span>
        </div>
      </div>
      <div id="dp-map" style="height:600px;border-radius:10px;overflow:hidden;box-shadow:var(--ombre);border:1px solid var(--gris-bordure);"></div>
      <div class="card mt-18" id="sites-sans-adresse" style="display:none;"></div>
      <div class="text-muted mt-18">
        Géolocalisation par géocodage automatique des adresses (OpenStreetMap / Nominatim, gratuit, sans clé API).
        Les coordonnées trouvées sont mises en cache localement pour éviter de re-géocoder à chaque visite.
      </div>
    `;
    map = L.map("dp-map").setView([44.55, 0.4], 7.3);
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
      maxZoom: 19
    }).addTo(map);
    markersLayer = L.layerGroup().addTo(map);
    mapReady = true;
  }
  geocodeAndRenderMarkers();
}

async function geocodeAndRenderMarkers() {
  const statusEl = document.getElementById("geocode-status");
  const sites = DP.sites;
  const avecAdresse = sites.filter(s => s.adresse && s.adresse.trim());

  // Affiche d'abord tout ce qui est déjà géocodé (instantané, jamais bloqué par le guard ci-dessous
  // pour que la carte se redessine correctement même après un rechargement des données depuis GitHub).
  markersLayer.clearLayers();
  const bounds = [];
  avecAdresse.forEach(s => { if (s.lat && s.lon) { addMarker(s); bounds.push([s.lat, s.lon]); } });
  if (bounds.length) map.fitBounds(bounds, { padding: [30, 30] });

  const aGeocoder = avecAdresse.filter(s => !(s.lat && s.lon));

  if (!aGeocoder.length) {
    statusEl.textContent = `${avecAdresse.length} site(s) localisé(s) sur ${sites.length}.`;
    renderMissingList(sites);
    return;
  }

  // Empêche deux boucles de géocodage de tourner en parallèle (ex. rechargement GitHub en
  // arrière-plan pendant qu'un géocodage est déjà en cours) — cela a saturé Nominatim (429).
  if (isGeocoding) return;
  isGeocoding = true;

  try {
    let index = 0;
    for (const s of aGeocoder) {
      index++;
      statusEl.textContent = `Géocodage des adresses en cours… (${index}/${aGeocoder.length})`;
      const coords = await dpGeocode(s.adresse);
      if (coords) {
        s.lat = coords.lat; s.lon = coords.lon;
        addMarker(s);
        bounds.push([s.lat, s.lon]);
        if (bounds.length) map.fitBounds(bounds, { padding: [30, 30] });
      }
      await dpSleep(1200); // respecte la politique d'usage Nominatim (~1 req/s)
    }
    dpPersist();
    if (dpGetGithubConfig()) dpSyncWithGitHub();
    const localises = DP.sites.filter(s => s.lat && s.lon).length;
    statusEl.textContent = `${localises} site(s) localisé(s) sur ${sites.length}.`;
  } finally {
    isGeocoding = false;
  }

  renderMissingList(sites);
}

function renderMissingList(sites) {
  const missingEl = document.getElementById("sites-sans-adresse");
  const nonLocalises = sites.filter(s => !(s.lat && s.lon));
  if (nonLocalises.length) {
    missingEl.style.display = "block";
    missingEl.innerHTML = `
      <div class="card-title">Sites non localisés (${nonLocalises.length})</div>
      <div class="text-muted mb-14">Adresse absente, non reconnue par le géocodeur, ou géocodage temporairement limité (réessayez dans quelques minutes) — à compléter dans le référentiel patrimoine si besoin.</div>
      <ul style="margin:0;padding-left:18px;">
        ${nonLocalises.map(s => `<li>${dpEsc(s.nom)}${s.adresse ? ` <span class="text-muted">(${dpEsc(s.adresse)})</span>` : ""}</li>`).join("")}
      </ul>
    `;
  } else {
    missingEl.style.display = "none";
  }
}

function addMarker(s) {
  const color = CARTE_CATEGORY_COLOR[s.categorie] || "#8a97a6";
  const marker = L.circleMarker([s.lat, s.lon], {
    radius: 9, color: "#fff", weight: 2, fillColor: color, fillOpacity: 0.95
  }).addTo(markersLayer);
  marker.bindPopup(`
    <div style="font-family:inherit;min-width:180px;">
      <strong>${dpEsc(s.nom)}</strong><br>
      <span style="color:#7c8b9b;font-size:12px;">${dpEsc(s.categorie)}${s.departement ? " &middot; dépt " + dpEsc(s.departement) : ""}</span><br>
      ${s.adresse ? `<span style="font-size:12.5px;">${dpEsc(s.adresse)}</span><br>` : ""}
      <span style="font-size:12.5px;">${s.surfaceM2 ? dpFormatNumber(s.surfaceM2, 0) + " m&sup2;" : "&mdash;"} &middot; ${s.effectif ?? "&mdash;"} pers.</span>
    </div>
  `);
}

async function dpGeocode(address, retryOn429) {
  try {
    const q = encodeURIComponent(address.replace(/\n/g, ", ") + ", France");
    const url = `https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=fr&q=${q}`;
    const resp = await fetch(url, { headers: { "Accept-Language": "fr" } });
    if (resp.status === 429 && !retryOn429) {
      await dpSleep(5000); // Nominatim demande de ralentir : on patiente puis on retente une fois
      return dpGeocode(address, true);
    }
    if (!resp.ok) return null;
    const data = await resp.json();
    if (!data.length) return null;
    return { lat: parseFloat(data[0].lat), lon: parseFloat(data[0].lon) };
  } catch (e) {
    console.error("Erreur de géocodage", e);
    return null;
  }
}

function dpSleep(ms) { return new Promise(r => setTimeout(r, ms)); }
</script>
</body>
</html>
