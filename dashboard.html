<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tableau de bord — DomPatrimoine</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<script src="app.js?v=6"></script>
<script>
const content = dpRenderShell("dashboard", "Tableau de bord", "Vue d'ensemble du patrimoine tertiaire et des contrats de fonctionnement");
if (content) render();

function render() {
  const sites = DP.sites;
  const contrats = DP.contrats;
  const annuaire = DP.annuaire;

  const surfaceTotale = sites.reduce((s, x) => s + (x.surfaceM2 || 0), 0);
  const effectifTotal = sites.reduce((s, x) => s + (x.effectif || 0), 0);
  const nbAgences = sites.filter(s => s.categorie === "Agence").length;

  const parType = {};
  contrats.forEach(c => { parType[c.type || "Non renseigné"] = (parType[c.type || "Non renseigné"] || 0) + 1; });
  const typesTries = Object.entries(parType).sort((a, b) => b[1] - a[1]);
  const maxType = typesTries.length ? typesTries[0][1] : 1;

  const parFournisseur = {};
  contrats.forEach(c => { if (c.fournisseur) parFournisseur[c.fournisseur] = (parFournisseur[c.fournisseur] || 0) + 1; });
  const topFournisseurs = Object.entries(parFournisseur).sort((a, b) => b[1] - a[1]).slice(0, 6);

  const parCategoriePrestation = {};
  annuaire.forEach(a => { if (a.categoriePrestation) parCategoriePrestation[a.categoriePrestation] = (parCategoriePrestation[a.categoriePrestation] || 0) + 1; });
  const nbCategoriesPrestations = Object.keys(parCategoriePrestation).length;

  const echeances = contrats.map(c => ({ c, info: dpEcheanceInfo(c.dateEcheance) }));
  const echus = echeances.filter(e => e.info.days !== null && e.info.days < 0);
  const proches = echeances.filter(e => e.info.days !== null && e.info.days >= 0 && e.info.days <= 60);
  const aSurveiller = echus.concat(proches).sort((a, b) => a.info.days - b.info.days).slice(0, 8);

  content.innerHTML = `
    <div class="grid-4 mb-14" style="margin-bottom:20px;">
      <div class="kpi-card">
        <div class="kpi-label">Sites &amp; agences suivis</div>
        <div class="kpi-value">${sites.length}</div>
        <div class="kpi-sub">dont ${nbAgences} agences commerciales</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">Surface administrative totale</div>
        <div class="kpi-value">${dpFormatNumber(surfaceTotale, 0)} m&sup2;</div>
        <div class="kpi-sub">tous sites confondus</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">Effectif hébergé</div>
        <div class="kpi-value">${dpFormatNumber(effectifTotal, 0)}</div>
        <div class="kpi-sub">${dpFormatNumber(surfaceTotale && effectifTotal ? surfaceTotale / effectifTotal : 0, 1)} m&sup2; / poste en moyenne</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">Échéances à surveiller</div>
        <div class="kpi-value" style="color:${echus.length ? 'var(--rouge)' : 'var(--bleu-fonce)'};">${echus.length + proches.length}</div>
        <div class="kpi-sub">${echus.length} échu(s), ${proches.length} sous 60 jours</div>
      </div>
    </div>

    ${aSurveiller.length ? `
    <div class="card mb-14" style="margin-bottom:20px;">
      <div class="card-title">Contrats à échéance proche ou dépassée</div>
      <table class="data-table">
        <thead><tr><th>Contrat</th><th>Fournisseur</th><th>Échéance</th></tr></thead>
        <tbody>
          ${aSurveiller.map(({ c, info }) => `
            <tr onclick="window.location.href='contrats.html'">
              <td><strong>${dpEsc(c.libelle)}</strong></td>
              <td>${dpEsc(c.fournisseur)}</td>
              <td><span class="badge ${info.cls}">${info.label}</span></td>
            </tr>
          `).join("")}
        </tbody>
      </table>
    </div>` : ""}

    <div class="grid-2">
      <div class="card">
        <div class="card-title">Répartition des contrats par type</div>
        ${typesTries.map(([type, n]) => `
          <div style="margin-bottom:10px;">
            <div style="display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:4px;">
              <span>${dpEsc(type)}</span><span class="text-muted">${n}</span>
            </div>
            <div class="progress-track"><div class="progress-fill" style="width:${(n / maxType) * 100}%"></div></div>
          </div>
        `).join("")}
      </div>

      <div class="card">
        <div class="card-title">Principaux fournisseurs (nb. de contrats)</div>
        <table class="data-table">
          <thead><tr><th>Fournisseur</th><th>Contrats</th></tr></thead>
          <tbody>
            ${topFournisseurs.map(([f, n]) => `<tr onclick="window.location.href='contrats.html?fournisseur=${encodeURIComponent(f)}'"><td>${dpEsc(f)}</td><td><span class="badge badge-blue">${n}</span></td></tr>`).join("")}
          </tbody>
        </table>
      </div>
    </div>

    <div class="grid-2 mt-18">
      <div class="card">
        <div class="card-title">Patrimoine — les plus grandes surfaces</div>
        <table class="data-table">
          <thead><tr><th>Site</th><th>m&sup2;</th><th>Effectif</th></tr></thead>
          <tbody>
            ${sites.slice().sort((a, b) => (b.surfaceM2 || 0) - (a.surfaceM2 || 0)).slice(0, 6).map(s => `
              <tr onclick="window.location.href='patrimoine.html'"><td>${dpEsc(s.nom)}</td><td>${dpFormatNumber(s.surfaceM2, 0)}</td><td>${s.effectif ?? "&mdash;"}</td></tr>
            `).join("")}
          </tbody>
        </table>
      </div>

      <div class="card">
        <div class="card-title">Annuaire prestataires</div>
        <div class="kpi-card" style="box-shadow:none;border:none;padding:4px 0 12px;">
          <div class="kpi-value" style="font-size:22px;">${annuaire.length}</div>
          <div class="kpi-sub">contacts référencés dans ${nbCategoriesPrestations} catégories de prestation, sur les secteurs Bordeaux, Agen et Pau-Bayonne</div>
        </div>
        <a href="annuaire.html" class="btn btn-outline btn-sm">Ouvrir l'annuaire &rarr;</a>
      </div>
    </div>
  `;
}
</script>
</body>
</html>
