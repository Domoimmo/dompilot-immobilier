<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Patrimoine — DomPatrimoine</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<script src="app.js?v=6"></script>
<script>
let filtres = { categorie: "", departement: "", recherche: "" };

const content = dpRenderShell("patrimoine", "Patrimoine", "Sites, agences et locaux administratifs — surfaces et effectifs");
if (content) render();

const SITE_FIELDS = [
  { key: "nom", label: "Nom du site", type: "text", required: true },
  { key: "categorie", label: "Catégorie", type: "select", options: ["Agence", "Logement de fonction"] },
  { key: "adresse", label: "Adresse", type: "textarea" },
  { key: "departement", label: "Département", type: "number" },
  { key: "surfaceM2", label: "Surface (m²)", type: "number" },
  { key: "effectif", label: "Effectif", type: "number" },
  { key: "commentaire", label: "Commentaire (statut, location...)", type: "text" }
];

function render() {
  const categories = dpUniqueSorted(DP.sites.map(s => s.categorie));
  const departements = dpUniqueSorted(DP.sites.map(s => s.departement));

  content.innerHTML = `
    <div class="filter-bar">
      <div class="field search">
        <label>Recherche</label>
        <input id="f-recherche" placeholder="Nom de site, adresse..." value="${dpEsc(filtres.recherche)}">
      </div>
      <div class="field">
        <label>Catégorie</label>
        <select id="f-categorie">
          <option value="">Toutes</option>
          ${categories.map(c => `<option value="${dpEsc(c)}" ${filtres.categorie === c ? "selected" : ""}>${dpEsc(c)}</option>`).join("")}
        </select>
      </div>
      <div class="field">
        <label>Département</label>
        <select id="f-departement">
          <option value="">Tous</option>
          ${departements.map(d => `<option value="${dpEsc(d)}" ${filtres.departement == d ? "selected" : ""}>${dpEsc(d)}</option>`).join("")}
        </select>
      </div>
      <div class="filter-count" id="f-count"></div>
      <button class="btn btn-accent btn-sm" onclick="openSiteForm(null)">+ Nouveau site</button>
    </div>
    <div class="table-wrap"><div id="table-holder"></div></div>
    <div id="drawer-holder"></div>
  `;

  document.getElementById("f-recherche").addEventListener("input", dpDebounce(e => { filtres.recherche = e.target.value; renderTable(); }, 150));
  document.getElementById("f-categorie").addEventListener("change", e => { filtres.categorie = e.target.value; renderTable(); });
  document.getElementById("f-departement").addEventListener("change", e => { filtres.departement = e.target.value; renderTable(); });

  renderTable();
}

function filteredSites() {
  return DP.sites.filter(s => {
    if (filtres.categorie && s.categorie !== filtres.categorie) return false;
    if (filtres.departement && String(s.departement) !== String(filtres.departement)) return false;
    if (filtres.recherche) {
      const q = filtres.recherche.toLowerCase();
      if (!(s.nom.toLowerCase().includes(q) || (s.adresse || "").toLowerCase().includes(q))) return false;
    }
    return true;
  }).sort((a, b) => (b.surfaceM2 || 0) - (a.surfaceM2 || 0));
}

function renderTable() {
  const list = filteredSites();
  document.getElementById("f-count").textContent = `${list.length} site${list.length > 1 ? "s" : ""}`;

  if (!list.length) {
    document.getElementById("table-holder").innerHTML = `<div class="table-empty">Aucun site ne correspond aux filtres.</div>`;
    return;
  }

  document.getElementById("table-holder").innerHTML = `
    <table class="data-table">
      <thead><tr>
        <th>Site</th><th>Catégorie</th><th>Département</th><th>Surface</th><th>Effectif</th><th>Ratio m&sup2;/poste</th>
      </tr></thead>
      <tbody>
        ${list.map(s => `
          <tr onclick="openSiteForm('${s.id}')">
            <td><strong>${dpEsc(s.nom)}</strong>${s.commentaire ? `<div class="text-muted">${dpEsc(s.commentaire)}</div>` : ""}</td>
            <td><span class="badge ${s.categorie === 'Agence' ? 'badge-blue' : 'badge-gray'}">${dpEsc(s.categorie)}</span></td>
            <td>${dpEsc(s.departement || "&mdash;")}</td>
            <td>${dpFormatNumber(s.surfaceM2, 1)} m&sup2;</td>
            <td>${s.effectif ?? "&mdash;"}</td>
            <td>${s.ratioM2ParPoste ? dpFormatNumber(s.ratioM2ParPoste, 1) : "&mdash;"}</td>
          </tr>
        `).join("")}
      </tbody>
    </table>
  `;
}

function openSiteForm(id) {
  const site = id ? DP.sites.find(x => x.id === id) : { categorie: "Agence" };
  const isNew = !id;
  document.getElementById("drawer-holder").innerHTML = `
    <div class="drawer-overlay" onclick="if(event.target===this) closeDrawer()">
      <div class="drawer">
        <div class="drawer-header">
          <h2 style="font-size:17px;">${isNew ? "Nouveau site" : dpEsc(site.nom)}</h2>
          <button class="drawer-close" onclick="closeDrawer()">&times;</button>
        </div>
        <div id="site-form">${dpRenderFormFields(SITE_FIELDS, site)}</div>
        <div style="display:flex;gap:8px;margin-top:8px;">
          <button class="btn btn-primary btn-sm" onclick="saveSite('${id || ""}')">Enregistrer</button>
          ${!isNew ? `<button class="btn btn-outline btn-sm" onclick="deleteSite('${id}')" style="color:var(--rouge);border-color:var(--rouge-clair);">Supprimer</button>` : ""}
          <button class="btn btn-outline btn-sm" onclick="closeDrawer()">Annuler</button>
        </div>
        ${site.ratioM2ParPoste ? `<div class="text-muted mt-18">Ratio m&sup2;/poste actuel : ${dpFormatNumber(site.ratioM2ParPoste, 1)} (recalculé automatiquement si vous modifiez surface/effectif et enregistrez).</div>` : ""}
      </div>
    </div>
  `;
}

function saveSite(id) {
  const values = dpReadFormFields(SITE_FIELDS);
  const missing = dpValidateRequired(SITE_FIELDS, values);
  if (missing.length) { alert("Champ requis manquant : " + missing.map(f => f.label).join(", ")); return; }

  if (values.surfaceM2 && values.effectif) {
    values.ratioM2ParPoste = Math.round((values.surfaceM2 / values.effectif) * 100) / 100;
  } else {
    values.ratioM2ParPoste = null;
  }

  if (id) {
    const idx = DP.sites.findIndex(x => x.id === id);
    DP.sites[idx] = { ...DP.sites[idx], ...values };
  } else {
    DP.sites.push({ id: dpGenId("site"), ...values });
  }
  dpAutoSync();
  closeDrawer();
  render();
}

function deleteSite(id) {
  if (!confirm("Supprimer définitivement ce site ?")) return;
  DP.sites = DP.sites.filter(x => x.id !== id);
  dpAutoSync();
  closeDrawer();
  render();
}

function closeDrawer() { document.getElementById("drawer-holder").innerHTML = ""; }
</script>
</body>
</html>
