<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Annuaire prestataires — DomPatrimoine</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<script src="app.js?v=12"></script>
<script>
let filtres = { secteur: "", categorie: "", recherche: "" };

const content = dpRenderShell("annuaire", "Annuaire prestataires", "Contacts fournisseurs et prestataires — Bordeaux, Agen, Pau-Bayonne");
if (content) render();

const CONTACT_FIELDS = [
  { key: "entreprise", label: "Entreprise", type: "text", required: true },
  { key: "categoriePrestation", label: "Catégorie de prestation", type: "text" },
  { key: "prestation", label: "Prestation", type: "text" },
  { key: "contact", label: "Nom du contact", type: "text" },
  { key: "fonction", label: "Fonction", type: "text" },
  { key: "telephone", label: "Téléphone", type: "text" },
  { key: "email1", label: "Email", type: "text" },
  { key: "email2", label: "Email (2)", type: "text" },
  { key: "secteur", label: "Secteur", type: "select", options: ["BORDEAUX", "AGEN", "PAU-BAYONNE", "Désinfection"] },
  { key: "commentaires", label: "Commentaires", type: "textarea" }
];

function render() {
  const secteurs = dpUniqueSorted(DP.annuaire.map(a => a.secteur));
  const categories = dpUniqueSorted(DP.annuaire.map(a => a.categoriePrestation));

  content.innerHTML = `
    <div class="filter-bar">
      <div class="field search">
        <label>Recherche</label>
        <input id="f-recherche" placeholder="Entreprise, contact, prestation..." value="${dpEsc(filtres.recherche)}">
      </div>
      <div class="field">
        <label>Secteur</label>
        <select id="f-secteur">
          <option value="">Tous</option>
          ${secteurs.map(s => `<option value="${dpEsc(s)}" ${filtres.secteur === s ? "selected" : ""}>${dpEsc(s)}</option>`).join("")}
        </select>
      </div>
      <div class="field">
        <label>Catégorie de prestation</label>
        <select id="f-categorie">
          <option value="">Toutes</option>
          ${categories.map(c => `<option value="${dpEsc(c)}" ${filtres.categorie === c ? "selected" : ""}>${dpEsc(c)}</option>`).join("")}
        </select>
      </div>
      <div class="filter-count" id="f-count"></div>
      <button class="btn btn-outline btn-sm" onclick="exportContacts()">&#8615; Exporter (Excel)</button>
      <button class="btn btn-accent btn-sm" onclick="openContactForm(null)">+ Nouveau contact</button>
    </div>
    <div class="table-wrap"><div id="table-holder"></div></div>
    <div id="drawer-holder"></div>
  `;

  document.getElementById("f-recherche").addEventListener("input", dpDebounce(e => { filtres.recherche = e.target.value; renderTable(); }, 150));
  document.getElementById("f-secteur").addEventListener("change", e => { filtres.secteur = e.target.value; renderTable(); });
  document.getElementById("f-categorie").addEventListener("change", e => { filtres.categorie = e.target.value; renderTable(); });

  renderTable();
}

function exportContacts() {
  const list = filteredAnnuaire();
  const headers = ["Entreprise", "Catégorie de prestation", "Prestation", "Contact", "Fonction",
    "Téléphone", "Email", "Email (2)", "Secteur", "Commentaires"];
  const rows = list.map(a => [a.entreprise, a.categoriePrestation, a.prestation, a.contact, a.fonction,
    a.telephone, a.email1, a.email2, a.secteur, a.commentaires]);
  dpExportCSV(`dompatrimoine_annuaire_${dpToday()}.csv`, headers, rows);
}

function filteredAnnuaire() {
  return DP.annuaire.filter(a => {
    if (filtres.secteur && a.secteur !== filtres.secteur) return false;
    if (filtres.categorie && a.categoriePrestation !== filtres.categorie) return false;
    if (filtres.recherche) {
      const q = filtres.recherche.toLowerCase();
      const hay = [a.entreprise, a.contact, a.prestation, a.categoriePrestation, a.fonction].join(" ").toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  }).sort((a, b) => a.entreprise.localeCompare(b.entreprise, "fr"));
}

function renderTable() {
  const list = filteredAnnuaire();
  document.getElementById("f-count").textContent = `${list.length} contact${list.length > 1 ? "s" : ""}`;

  if (!list.length) {
    document.getElementById("table-holder").innerHTML = `<div class="table-empty">Aucun contact ne correspond aux filtres.</div>`;
    return;
  }

  document.getElementById("table-holder").innerHTML = `
    <table class="data-table">
      <thead><tr>
        <th>Entreprise</th><th>Prestation</th><th>Contact</th><th>Fonction</th><th>Téléphone</th><th>Email</th><th>Secteur</th>
      </tr></thead>
      <tbody>
        ${list.map(a => `
          <tr onclick="openContactForm('${a.id}')">
            <td><strong>${dpEsc(a.entreprise)}</strong>${a.categoriePrestation ? `<div class="text-muted">${dpEsc(a.categoriePrestation)}</div>` : ""}</td>
            <td>${dpEsc(a.prestation || "&mdash;")}</td>
            <td>${dpEsc(a.contact || "&mdash;")}</td>
            <td>${dpEsc(a.fonction || "&mdash;")}</td>
            <td>${dpEsc(a.telephone || "&mdash;")}</td>
            <td>${dpEsc(a.email1 || "&mdash;")}</td>
            <td><span class="badge badge-gray">${dpEsc(a.secteur)}</span></td>
          </tr>
        `).join("")}
      </tbody>
    </table>
  `;
}

function openContactForm(id) {
  const contact = id ? DP.annuaire.find(x => x.id === id) : { secteur: "BORDEAUX" };
  const isNew = !id;
  document.getElementById("drawer-holder").innerHTML = `
    <div class="drawer-overlay" onclick="if(event.target===this) closeDrawer()">
      <div class="drawer">
        <div class="drawer-header">
          <h2 style="font-size:17px;">${isNew ? "Nouveau contact" : dpEsc(contact.entreprise)}</h2>
          <button class="drawer-close" onclick="closeDrawer()">&times;</button>
        </div>
        <div id="contact-form">${dpRenderFormFields(CONTACT_FIELDS, contact)}</div>
        <div style="display:flex;gap:8px;margin-top:8px;">
          <button class="btn btn-primary btn-sm" onclick="saveContact('${id || ""}')">Enregistrer</button>
          ${!isNew ? `<button class="btn btn-outline btn-sm" onclick="deleteContact('${id}')" style="color:var(--rouge);border-color:var(--rouge-clair);">Supprimer</button>` : ""}
          <button class="btn btn-outline btn-sm" onclick="closeDrawer()">Annuler</button>
        </div>
      </div>
    </div>
  `;
}

function saveContact(id) {
  const values = dpReadFormFields(CONTACT_FIELDS);
  const missing = dpValidateRequired(CONTACT_FIELDS, values);
  if (missing.length) { alert("Champ requis manquant : " + missing.map(f => f.label).join(", ")); return; }

  if (id) {
    const idx = DP.annuaire.findIndex(x => x.id === id);
    DP.annuaire[idx] = { ...DP.annuaire[idx], ...values };
  } else {
    DP.annuaire.push({ id: dpGenId("ann"), ...values });
  }
  dpAutoSync();
  closeDrawer();
  render();
}

function deleteContact(id) {
  if (!confirm("Supprimer définitivement ce contact ?")) return;
  DP.annuaire = DP.annuaire.filter(x => x.id !== id);
  dpAutoSync();
  closeDrawer();
  render();
}

function closeDrawer() { document.getElementById("drawer-holder").innerHTML = ""; }
</script>
</body>
</html>
