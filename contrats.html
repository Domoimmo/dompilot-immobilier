<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contrats — DomPatrimoine</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<script src="app.js?v=8"></script>
<script>
const urlParams = new URLSearchParams(window.location.search);
let filtres = { type: "", fournisseur: urlParams.get("fournisseur") || "", site: urlParams.get("site") || "", echeance: "", recherche: "" };

const content = dpRenderShell("contrats", "Contrats de fonctionnement", "Nettoyage, sécurité, location de matériel, contrôle réglementaire...");
if (content) render();

function getContratFields() {
  const siteOptions = [""].concat(DP.sites.slice().sort((a, b) => a.nom.localeCompare(b.nom, "fr")).map(s => s.id));
  return [
    { key: "libelle", label: "Libellé", type: "text", required: true },
    { key: "siteId", label: "Site rattaché", type: "select", options: siteOptions,
      optionLabels: { "": "Non rattaché (global / multi-sites)", ...Object.fromEntries(DP.sites.map(s => [s.id, s.nom])) } },
    { key: "type", label: "Type", type: "text" },
    { key: "organisme", label: "Organisme", type: "text" },
    { key: "ho", label: "Rattachement (HO)", type: "text" },
    { key: "numero", label: "N° contrat", type: "text" },
    { key: "referenceExterne", label: "Référence externe", type: "text" },
    { key: "fournisseur", label: "Fournisseur", type: "text" },
    { key: "signataire", label: "Signataire", type: "text" },
    { key: "dateSignature", label: "Date de signature", type: "date" },
    { key: "dateEcheance", label: "Date d'échéance", type: "date" },
    { key: "etat", label: "État", type: "text" },
    { key: "avancement", label: "Avancement", type: "text" }
  ];
}

function siteNom(siteId) {
  const s = DP.sites.find(x => x.id === siteId);
  return s ? s.nom : null;
}

function render() {
  const types = dpUniqueSorted(DP.contrats.map(c => c.type));
  const fournisseurs = dpUniqueSorted(DP.contrats.map(c => c.fournisseur));
  const sitesTries = DP.sites.slice().sort((a, b) => a.nom.localeCompare(b.nom, "fr"));

  content.innerHTML = `
    <div class="filter-bar">
      <div class="field search">
        <label>Recherche</label>
        <input id="f-recherche" placeholder="Libellé, n° contrat, référence..." value="${dpEsc(filtres.recherche)}">
      </div>
      <div class="field">
        <label>Type</label>
        <select id="f-type">
          <option value="">Tous</option>
          ${types.map(t => `<option value="${dpEsc(t)}" ${filtres.type === t ? "selected" : ""}>${dpEsc(t)}</option>`).join("")}
        </select>
      </div>
      <div class="field">
        <label>Fournisseur</label>
        <select id="f-fournisseur">
          <option value="">Tous</option>
          ${fournisseurs.map(f => `<option value="${dpEsc(f)}" ${filtres.fournisseur === f ? "selected" : ""}>${dpEsc(f)}</option>`).join("")}
        </select>
      </div>
      <div class="field">
        <label>Site</label>
        <select id="f-site">
          <option value="">Tous</option>
          ${sitesTries.map(s => `<option value="${dpEsc(s.id)}" ${filtres.site === s.id ? "selected" : ""}>${dpEsc(s.nom)}</option>`).join("")}
        </select>
      </div>
      <div class="field">
        <label>Échéance</label>
        <select id="f-echeance">
          <option value="">Toutes</option>
          <option value="echu" ${filtres.echeance === "echu" ? "selected" : ""}>Échu</option>
          <option value="proche" ${filtres.echeance === "proche" ? "selected" : ""}>Proche (&le; 60 j)</option>
          <option value="ok" ${filtres.echeance === "ok" ? "selected" : ""}>À jour</option>
          <option value="non_renseignee" ${filtres.echeance === "non_renseignee" ? "selected" : ""}>Non renseignée</option>
        </select>
      </div>
      <div class="filter-count" id="f-count"></div>
      <button class="btn btn-outline btn-sm" onclick="exportContrats()">&#8615; Exporter (Excel)</button>
      <button class="btn btn-accent btn-sm" onclick="openContratForm(null)">+ Nouveau contrat</button>
    </div>
    <div class="table-wrap"><div id="table-holder"></div></div>
    <div id="drawer-holder"></div>
  `;

  document.getElementById("f-recherche").addEventListener("input", dpDebounce(e => { filtres.recherche = e.target.value; renderTable(); }, 150));
  document.getElementById("f-type").addEventListener("change", e => { filtres.type = e.target.value; renderTable(); });
  document.getElementById("f-fournisseur").addEventListener("change", e => { filtres.fournisseur = e.target.value; renderTable(); });
  document.getElementById("f-site").addEventListener("change", e => { filtres.site = e.target.value; renderTable(); });
  document.getElementById("f-echeance").addEventListener("change", e => { filtres.echeance = e.target.value; renderTable(); });

  renderTable();
}

function exportContrats() {
  const list = filteredContrats();
  const headers = ["Libellé", "Type", "Site", "Organisme", "HO", "N° contrat", "Référence externe",
    "Fournisseur", "Signataire", "Date signature", "Date échéance", "État", "Avancement"];
  const rows = list.map(c => [c.libelle, c.type, siteNom(c.siteId) || "", c.organisme, c.ho, c.numero,
    c.referenceExterne, c.fournisseur, c.signataire, c.dateSignature, c.dateEcheance, c.etat, c.avancement]);
  dpExportCSV(`dompatrimoine_contrats_${dpToday()}.csv`, headers, rows);
}

function echeanceMatch(c, filtre) {
  if (!filtre) return true;
  const info = dpEcheanceInfo(c.dateEcheance);
  if (filtre === "non_renseignee") return info.days === null;
  if (filtre === "echu") return info.days !== null && info.days < 0;
  if (filtre === "proche") return info.days !== null && info.days >= 0 && info.days <= 60;
  if (filtre === "ok") return info.days !== null && info.days > 60;
  return true;
}

function filteredContrats() {
  return DP.contrats.filter(c => {
    if (filtres.type && c.type !== filtres.type) return false;
    if (filtres.fournisseur && c.fournisseur !== filtres.fournisseur) return false;
    if (filtres.site && c.siteId !== filtres.site) return false;
    if (!echeanceMatch(c, filtres.echeance)) return false;
    if (filtres.recherche) {
      const q = filtres.recherche.toLowerCase();
      if (!((c.libelle + " " + c.numero + " " + c.referenceExterne + " " + c.fournisseur).toLowerCase().includes(q))) return false;
    }
    return true;
  }).sort((a, b) => {
    const ia = dpEcheanceInfo(a.dateEcheance).days, ib = dpEcheanceInfo(b.dateEcheance).days;
    if (ia === null && ib === null) return (b.dateSignature || "").localeCompare(a.dateSignature || "");
    if (ia === null) return 1;
    if (ib === null) return -1;
    return ia - ib;
  });
}

function renderTable() {
  const list = filteredContrats();
  document.getElementById("f-count").textContent = `${list.length} contrat${list.length > 1 ? "s" : ""}`;

  if (!list.length) {
    document.getElementById("table-holder").innerHTML = `<div class="table-empty">Aucun contrat ne correspond aux filtres.</div>`;
    return;
  }

  document.getElementById("table-holder").innerHTML = `
    <table class="data-table">
      <thead><tr>
        <th>Libellé</th><th>Type</th><th>Site</th><th>Fournisseur</th><th>N&deg; contrat</th><th>Échéance</th>
      </tr></thead>
      <tbody>
        ${list.map(c => {
          const ech = dpEcheanceInfo(c.dateEcheance);
          const site = siteNom(c.siteId);
          return `
          <tr onclick="openContratForm('${c.id}')">
            <td><strong>${dpEsc(c.libelle)}</strong><div class="text-muted">${dpEsc(c.ho)}</div></td>
            <td><span class="badge badge-blue">${dpEsc(c.type)}</span></td>
            <td>${site ? dpEsc(site) : '<span class="text-muted">Non rattaché</span>'}</td>
            <td>${dpEsc(c.fournisseur)}</td>
            <td>${dpEsc(c.numero)}</td>
            <td><span class="badge ${ech.cls}">${ech.label}</span></td>
          </tr>`;
        }).join("")}
      </tbody>
    </table>
  `;
}

function openContratForm(id) {
  const contrat = id ? DP.contrats.find(x => x.id === id) : { etat: "E", siteId: "" };
  const isNew = !id;
  const mois = contrat.prestationsMensuelles ? Object.keys(contrat.prestationsMensuelles) : [];
  document.getElementById("drawer-holder").innerHTML = `
    <div class="drawer-overlay" onclick="if(event.target===this) closeDrawer()">
      <div class="drawer">
        <div class="drawer-header">
          <h2 style="font-size:17px;">${isNew ? "Nouveau contrat" : dpEsc(contrat.libelle)}</h2>
          <button class="drawer-close" onclick="closeDrawer()">&times;</button>
        </div>
        <div id="contrat-form">${dpRenderFormFields(getContratFields(), contrat)}</div>
        <div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;">
          <button class="btn btn-primary btn-sm" onclick="saveContrat('${id || ""}')">Enregistrer</button>
          ${!isNew ? `<button class="btn btn-outline btn-sm" onclick="deleteContrat('${id}')" style="color:var(--rouge);border-color:var(--rouge-clair);">Supprimer</button>` : ""}
          <button class="btn btn-outline btn-sm" onclick="closeDrawer()">Annuler</button>
        </div>
        ${mois.length ? `
        <div class="drawer-section mt-18">
          <h3>Prestations mensuelles (import initial, lecture seule)</h3>
          ${mois.map(m => `<div class="kv-row"><span class="k">${dpEsc(m)}</span><span class="v">${dpEsc(contrat.prestationsMensuelles[m])}</span></div>`).join("")}
        </div>` : ""}
      </div>
    </div>
  `;
}

function saveContrat(id) {
  const fields = getContratFields();
  const values = dpReadFormFields(fields);
  const missing = dpValidateRequired(fields, values);
  if (missing.length) { alert("Champ requis manquant : " + missing.map(f => f.label).join(", ")); return; }

  if (id) {
    const idx = DP.contrats.findIndex(x => x.id === id);
    DP.contrats[idx] = { ...DP.contrats[idx], ...values };
  } else {
    DP.contrats.push({ id: dpGenId("ctr"), prestationsMensuelles: {}, passageAnnuel: "", ...values });
  }
  dpAutoSync();
  closeDrawer();
  render();
}

function deleteContrat(id) {
  if (!confirm("Supprimer définitivement ce contrat ?")) return;
  DP.contrats = DP.contrats.filter(x => x.id !== id);
  dpAutoSync();
  closeDrawer();
  render();
}

function closeDrawer() { document.getElementById("drawer-holder").innerHTML = ""; }
</script>
</body>
</html>
